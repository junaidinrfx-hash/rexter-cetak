<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C244A">
<title>REXTER Cetak Stiker</title>
<style>
:root{--navy:#1C244A;--navy2:#2A3566;--or:#FF6800;--merah:#EF5451;--bg:#F3F5F9;--card:#FFFFFF;--line:#E3E6EE;--mute:#64748B;--ok:#0F8A5F;--err:#C62828}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:Arial,Helvetica,sans-serif}
.top{background:var(--navy);color:#fff;padding:14px max(16px,env(safe-area-inset-left,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px}
.top b{font-size:17px;letter-spacing:.04em}.top span{color:#C9CFE6;font-size:13px}
main{max-width:760px;margin:0 auto;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px}
h1{font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--navy2)}
.prev{width:100%;border-radius:12px;box-shadow:0 2px 10px rgba(28,36,74,.12);background:#FFE34D}
.meta{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#EEF1F6;border-radius:999px;padding:5px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;border:0;border-radius:14px;padding:14px 22px;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid rgba(255,104,0,.5);outline-offset:2px}
.utama{background:var(--or);color:#fff;font-size:17px;flex:1 1 220px}
.kedua{background:#fff;color:var(--navy);border:1px solid var(--line)}
button:disabled{opacity:.55;cursor:default}
.st{font-size:14px;line-height:1.5;white-space:pre-line;color:var(--mute)}.st.ok{color:var(--ok);font-weight:700}.st.err{color:var(--err);font-weight:700}
.kecil{font-size:12.5px;color:var(--mute);line-height:1.5}
footer{text-align:center;font-size:12px;color:var(--mute);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div class="top"><b>REXTER</b><span>Cetak stiker leher tabung</span></div>
<main>
  <section class="card">
    <h1>Stiker</h1>
    <img id="prev" class="prev" alt="Pratinjau stiker">
    <div class="meta" id="meta"></div>
  </section>
  <section class="card">
    <h1>Printer Brother PT-D610BT</h1>
    <div class="btns"><button class="utama" id="bCetak" type="button">Cetak stiker</button><button class="kedua" id="bGanti" type="button">Pilih printer</button></div>
    <div class="st" id="st">Pastikan printer menyala dan sudah di-pairing di Bluetooth tab.</div>
    <div class="kecil">Pertama kali: tekan Cetak stiker lalu pilih PT-D610BT. Berikutnya printer diingat otomatis.</div>
  </section>
</main>
<footer>Made with ❤ Powered by ReedFOX</footer>

const SPP_UUID='00001101-0000-1000-8000-00805f9b34fb';
const PITA_PIN={24:[0,128],18:[8,112],12:[29,70],9:[39,50],6:[48,32],4:[52,24],3:[52,24]};
const $=id=>document.getElementById(id);
function lapor(m,k){const e=$('st');e.textContent=m;e.className='st'+(k?' '+k:'');}
function baca(){try{const h=location.hash.replace(/^#d=/,'');if(!h)return null;const b=atob(h.replace(/-/g,'+').replace(/_/g,'/'));return JSON.parse(decodeURIComponent(escape(b)));}catch(e){return null;}}
const D=baca();let cetakUrl='';
function muat(src){return new Promise(ok=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>ok(null);im.src=src;});}
(async()=>{
  if(!D){lapor('Data stiker tidak ada. Buka halaman ini dari tombol Cetak langsung di REXTER.','err');$('bCetak').disabled=true;return;}
  const logo=await muat(LOGO);
  cetakUrl=KARTU.leher(D,logo).toDataURL('image/png');
  $('prev').src=KARTU.leher(D,logo,24,'#FFE34D').toDataURL('image/png');
  $('meta').innerHTML='';[D.batch,D.fill?'#'+String(D.fill).padStart(3,'0'):'',D.sn].filter(Boolean).forEach(t=>{const s=document.createElement('span');s.className='chip';s.textContent=t;$('meta').appendChild(s);});
  if(!('serial' in navigator)){lapor('Browser ini belum mendukung Bluetooth langsung. Buka halaman ini di Google Chrome versi terbaru (Android).','err');$('bCetak').disabled=true;$('bGanti').disabled=true;return;}
  const ada=await navigator.serial.getPorts();if(ada.length)lapor('Printer tersimpan. Tekan Cetak stiker.');
})();
async function minta(){return navigator.serial.requestPort({allowedBluetoothServiceClassIds:[SPP_UUID],filters:[{bluetoothServiceClassId:SPP_UUID}]});}
async function port(){const a=await navigator.serial.getPorts();return a.length?a[0]:minta();}
async function bacaN(p,n,ms){const r=p.readable.getReader(),buf=[];const t=setTimeout(()=>{try{r.cancel();}catch(e){}},ms);try{while(buf.length<n){const x=await r.read();if(x.done)break;for(const v of x.value)buf.push(v);}}finally{clearTimeout(t);r.releaseLock();}return buf;}
function raster(url,pin0,n){return new Promise((ok,no)=>{const im=new Image();im.onerror=()=>no(new Error('Gambar stiker tidak terbaca.'));im.onload=()=>{const W=im.width,H=im.height,c=document.createElement('canvas');c.width=W;c.height=n;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,n);const pot=Math.max(0,(H-n)/2);g.drawImage(im,0,pot,W,H-2*pot,0,0,W,n);const p=g.getImageData(0,0,W,n).data,rows=[];for(let x=0;x<W;x++){const L=new Uint8Array(16);let isi=false;for(let y=0;y<n;y++){const i=(y*W+x)*4;if(0.3*p[i]+0.59*p[i+1]+0.11*p[i+2]<128){const pin=pin0+y;L[15-(pin>>3)]|=1<<(pin&7);isi=true;}}rows.push(isi?L:null);}ok(rows);};im.src=url;});}
async function cetak(pilihBaru){
  const b=$('bCetak'),g=$('bGanti');b.disabled=g.disabled=true;lapor('Menghubungi printer…');let p;
  try{
    p=pilihBaru?await minta():await port();await p.open({baudRate:9600});
    let w=p.writable.getWriter();const awal=new Uint8Array(103);awal.set([0x1B,0x40,0x1B,0x69,0x53],98);await w.write(awal);w.releaseLock();
    const st=await bacaN(p,32,5000);
    if(st.length<32||st[0]!==0x80)throw new Error('Printer tidak menjawab. Pastikan printer menyala dan tidak sedang dipakai iPrint&Label.');
    if(st[8]||st[9])throw new Error('Printer melaporkan error (kode '+st[8]+'/'+st[9]+'). Cek kaset pita dan tutupnya.');
    const lebar=st[10],pp=PITA_PIN[lebar];if(!pp)throw new Error('Lebar pita '+lebar+' mm belum didukung.');
    lapor('Mengirim stiker ('+lebar+' mm)…');
    const rows=await raster(cetakUrl,pp[0],pp[1]),n=rows.length;w=p.writable.getWriter();const k=a=>w.write(a instanceof Uint8Array?a:new Uint8Array(a));
    await k([0x1B,0x69,0x61,0x01]);
    await k([0x1B,0x69,0x7A,0x86,st[11],lebar,0,n&255,(n>>8)&255,(n>>16)&255,0,0,0]);
    await k([0x1B,0x69,0x4D,0x40]);await k([0x1B,0x69,0x4B,0x08]);await k([0x1B,0x69,0x64,14,0]);await k([0x4D,0x02]);
    let pk=[];for(const L of rows){if(L){pk.push(0x47,17,0,15);for(const v of L)pk.push(v);}else pk.push(0x5A);if(pk.length>4000){await k(pk);pk=[];}}
    pk.push(0x1A);await k(pk);w.releaseLock();await bacaN(p,32,8000).catch(()=>{});
    lapor('Stiker terkirim ke printer. Kalau hasilnya terbalik atau cermin, kabari supaya arahnya dibetulkan.','ok');
  }catch(e){
    if(e&&e.name==='NotFoundError')lapor('Printer belum dipilih. Pastikan PT-D610BT sudah di-pairing, lalu tekan Pilih printer.','err');
    else lapor('Gagal cetak: '+(e&&e.message||e),'err');
  }finally{try{if(p)await p.close();}catch(e){}b.disabled=g.disabled=false;}
}
$('bCetak').onclick=()=>cetak(false);$('bGanti').onclick=()=>cetak(true);
